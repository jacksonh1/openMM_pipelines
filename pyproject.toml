[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openmm_pipelines"
version = "0.0.1"
description = "Pythonic OpenMM engine for explicit-solvent protein MD (plain MD, T-REMD, REST2 behind one prepare/produce seam)"
requires-python = ">=3.10"              # match statements, zip(strict=True)
dependencies = [
    "openmm>=8.6",
    "pdbfixer",                          # conda-forge; structure prep + protonation
    "mdtraj",                            # the trajectory library (no MDAnalysis / MD-specific libs)
    "biotite>=1.0",                      # lDDT to the design pose (biotite.structure.lddt)
    "numpy",
    "scipy",                             # analysis clustering (hierarchical)
    "scikit-learn>=1.3",                 # default DBSCAN + HDBSCAN conformational clustering (>=1.3 ships HDBSCAN)
    "pandas",                            # production.log parsing for run_report
    "matplotlib",                        # analysis plots
    "pydantic>=2",
    "openmmtools",                       # T-REMD / REST2 backends; imported eagerly from the top-level package
]

[project.optional-dependencies]
report = ["plotly"]                       # only the interactive HTML analysis report needs it
test = ["pytest"]

# NOTE: openmm + pdbfixer are distributed via conda-forge. The intended install is
#   conda create -n openmm_pipelines -c conda-forge openmm pdbfixer mdtraj
#   pip install -e .

[tool.setuptools.packages.find]
include = ["openmm_pipelines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: builds/runs real OpenMM systems (solvation, dynamics); deselect with -m 'not slow'",
]
